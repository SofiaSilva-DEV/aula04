<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário - Exemplo 1</title>
</head>
<body>
    <header>
        <h1 style="text-align: center; color: #4b0082;">
    Formulário de Cadastro
</h1>
    </header>
    <!--Conteúdo principal-->
    <main>
       <form action="#" method="GET" style="background-color: #a642e4; padding: 20px; border-radius: 8px; width: 300px; margin: 0 auto; color: white;">
        <!--Primeiro Campo-->
        <label for="nome">Nome</label><br>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome..."> 
        
        <br><br>
        
        <!--Segundo Campo-->
        <label for="idade">Idade</label><br>
        <input type="number" id="idade" name="idade" placeholder="Digite sua idade..."> required
        >
        <!--Botão--> 
        <button type="submit">Enviar</button>
       </form>
    </main>
</body>
</html>
